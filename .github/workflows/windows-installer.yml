name: Build and Release Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: market-glass-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Use official crates.io on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Use official crates.io on macOS
        if: runner.os == 'macOS'
        run: rm -f .cargo/config.toml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend types
        run: pnpm typecheck

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: Market Glass v__VERSION__
          releaseBody: |
            此版本由 Market Glass 自动发布流程生成。
            应用会通过签名校验后，在程序内部提示、下载并安装后续更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Verify and publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Resolve version
        shell: bash
        run: |
          APP_VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Download updater manifest and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${APP_VERSION}" --repo "${{ github.repository }}" --pattern latest.json --dir updater-manifest
          gh release view "v${APP_VERSION}" --repo "${{ github.repository }}" --json assets > updater-manifest/assets.json

      - name: Rewrite updater downloads to public release URLs
        run: |
          node --test scripts/rewrite-updater-manifest.test.mjs
          node scripts/rewrite-updater-manifest.mjs \
            updater-manifest/latest.json \
            updater-manifest/assets.json \
            "${{ github.repository }}" \
            "v${APP_VERSION}"

      - name: Validate updater platforms
        run: |
          node -e "const m=require('./updater-manifest/latest.json'); for (const p of ['darwin-aarch64','windows-x86_64']) { const e=m.platforms?.[p]; if (!e?.url || !e?.signature) throw new Error('Missing updater platform: '+p); if (new URL(e.url).hostname !== 'github.com') throw new Error('Updater URL is not public: '+p) }"

      - name: Replace updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${APP_VERSION}" updater-manifest/latest.json --repo "${{ github.repository }}" --clobber

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${APP_VERSION}" --repo "${{ github.repository }}" --draft=false

      - name: Verify public updater downloads
        run: |
          curl --fail --location --retry 5 --retry-all-errors --head \
            "https://github.com/${{ github.repository }}/releases/download/v${APP_VERSION}/latest.json"
          node -e "const m=require('./updater-manifest/latest.json'); for (const p of ['darwin-aarch64','windows-x86_64']) console.log(m.platforms[p].url)" \
            | xargs -n 1 curl --fail --location --retry 5 --retry-all-errors --head
